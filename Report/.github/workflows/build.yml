name: build

# Compiles the thesis on every push, so a broken \include or a missing figure
# is caught immediately rather than the week before submission.

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile thesis
        uses: xu-cheng/latex-action@v3
        with:
          root_file: 0_main.tex
          latexmk_use_lualatex: false
          args: -pdf -interaction=nonstopmode -file-line-error
      - uses: actions/upload-artifact@v4
        with:
          name: thesis
          path: 0_main.pdf
