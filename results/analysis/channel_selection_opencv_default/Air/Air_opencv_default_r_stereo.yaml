      rows: 3
      cols: 1
      dt: d
      data: [ -150.2090075146395, 0.80481717725475721,
          -2.2186218073312203 ]
   # baseline |T| = 150.23 mm - CHECK THIS AGAINST A RULER.
   # It carries the same scale error as TAG_SIZE, so a wrong tag size shows up here
   # first, and then in every reconstructed distance.
   baseline_mm: 150.2275472473201
   # Rotation as angles about x, y, z (Rodrigues), degrees: 0.223, -1.001, 0.120
   rotation_angles_deg: [ 0.22287281029821163, -1.0011442621015887,
       0.11996475474646831 ]
   essential_matrix: !!opencv-matrix
