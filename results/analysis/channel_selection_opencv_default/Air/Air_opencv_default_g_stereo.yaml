# ---- Stereo extrinsics: where the right camera sits relative to the left ----
stereo:
   status: computed
   # R and T map a point from the LEFT camera frame to the RIGHT:
   #   X_right = R @ X_left + T        (T in mm, same units as tag_size_mm)
   # Intrinsics were held fixed (CALIB_FIX_INTRINSIC) while these were fitted.
   rotation_matrix: !!opencv-matrix
      rows: 3
      cols: 3
      dt: d
      data: [ 0.99984813910927195, -0.0020758438882842959,
          -0.017302878138546886, 0.0021147948128381906,
          0.99999527037396474, 0.0022331306725857612,
          0.017298160671745531, -0.0022693835843072873,
          0.99984780018536912 ]
   translation_mm: !!opencv-matrix
      rows: 3
      cols: 1
      dt: d
      data: [ -150.34759178938839, 0.52355489724918103,
          -1.0670042309453776 ]
   # baseline |T| = 150.35 mm - CHECK THIS AGAINST A RULER.
   # It carries the same scale error as TAG_SIZE, so a wrong tag size shows up here
   # first, and then in every reconstructed distance.
   baseline_mm: 150.35228952240087
   # Rotation as angles about x, y, z (Rodrigues), degrees: -0.129, -0.991, 0.120
   rotation_angles_deg: [ -0.12899417081915257, -0.99129776301805717,
       0.12005913443280548 ]
   essential_matrix: !!opencv-matrix
      rows: 3
      cols: 3
