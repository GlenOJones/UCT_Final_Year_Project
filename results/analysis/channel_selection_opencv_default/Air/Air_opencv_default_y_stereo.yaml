# ---- Stereo extrinsics: where the right camera sits relative to the left ----
stereo:
   status: computed
   # R and T map a point from the LEFT camera frame to the RIGHT:
   #   X_right = R @ X_left + T        (T in mm, same units as tag_size_mm)
   # Intrinsics were held fixed (CALIB_FIX_INTRINSIC) while these were fitted.
   rotation_matrix: !!opencv-matrix
      rows: 3
      cols: 3
      dt: d
      data: [ 0.99985216601547189, -0.0020499181458661915,
          -0.017071729548127412, 0.0021152647384728809,
          0.9999905024861937, 0.0038105895207955357,
          0.017063756012535201, -0.0038461374137011813,
          0.99984700602529164 ]
   translation_mm: !!opencv-matrix
      rows: 3
      cols: 1
      dt: d
      data: [ -150.37676946439498, 0.040934312251616353,
          1.1656833838082015 ]
   # baseline |T| = 150.38 mm - CHECK THIS AGAINST A RULER.
   # It carries the same scale error as TAG_SIZE, so a wrong tag size shows up here
   # first, and then in every reconstructed distance.
   baseline_mm: 150.3812930118537
   # Rotation as angles about x, y, z (Rodrigues), degrees: -0.219, -0.978, 0.119
   rotation_angles_deg: [ -0.21936041475345289, -0.97796020864490252,
       0.11932987200002043 ]
