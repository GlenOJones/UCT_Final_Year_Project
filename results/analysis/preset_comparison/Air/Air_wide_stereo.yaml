# ---- Stereo extrinsics: where the right camera sits relative to the left ----
stereo:
   status: computed
   # R and T map a point from the LEFT camera frame to the RIGHT:
   #   X_right = R @ X_left + T        (T in mm, same units as tag_size_mm)
   # Intrinsics were held fixed (CALIB_FIX_INTRINSIC) while these were fitted.
   rotation_matrix: !!opencv-matrix
      rows: 3
      cols: 3
      dt: d
      data: [ 0.99984489685975853, -0.0020384905791093373,
          -0.017493621113360926, 0.002037092061766623,
          0.99999792034695401, -9.7763485000089913e-05,
          0.017493784022641644, 6.2112204874986826e-05,
          0.99984697012224988 ]
   translation_mm: !!opencv-matrix
      rows: 3
      cols: 1
      dt: d
      data: [ -150.313338708755, 0.70537112619655162,
          -1.9605158608257793 ]
   # baseline |T| = 150.33 mm - CHECK THIS AGAINST A RULER.
   # It carries the same scale error as TAG_SIZE, so a wrong tag size shows up here
   # first, and then in every reconstructed distance.
   baseline_mm: 150.32777841982207
   # Rotation as angles about x, y, z (Rodrigues), degrees: 0.005, -1.002, 0.117
   rotation_angles_deg: [ 0.0045803379538843928, -1.0023671502376708,
       0.11676287913930472 ]
   essential_matrix: !!opencv-matrix
      rows: 3
