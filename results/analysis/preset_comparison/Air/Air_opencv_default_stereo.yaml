# ---- Stereo extrinsics: where the right camera sits relative to the left ----
stereo:
   status: computed
   # R and T map a point from the LEFT camera frame to the RIGHT:
   #   X_right = R @ X_left + T        (T in mm, same units as tag_size_mm)
   # Intrinsics were held fixed (CALIB_FIX_INTRINSIC) while these were fitted.
   rotation_matrix: !!opencv-matrix
      rows: 3
      cols: 3
      dt: d
      data: [ 0.99985245438623638, -0.0019999529921415436,
          -0.017060763343072712, 0.001970653071668986,
          0.99999655483581174, -0.0017340250801336191,
          0.017064172534589282, 0.0017001483866518536,
          0.99985295094387416 ]
   translation_mm: !!opencv-matrix
      rows: 3
      cols: 1
      dt: d
      data: [ -150.2559399979524, 1.119989864038943, -3.5994556024538542 ]
   # baseline |T| = 150.30 mm - CHECK THIS AGAINST A RULER.
   # It carries the same scale error as TAG_SIZE, so a wrong tag size shows up here
   # first, and then in every reconstructed distance.
   baseline_mm: 150.30322006729551
   # Rotation as angles about x, y, z (Rodrigues), degrees: 0.098, -0.978, 0.114
   rotation_angles_deg: [ 0.098386710122978185, -0.97765596485824879,
       0.11375513543243784 ]
   essential_matrix: !!opencv-matrix
      rows: 3
