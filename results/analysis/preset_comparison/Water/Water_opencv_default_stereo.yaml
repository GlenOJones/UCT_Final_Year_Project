   # camera_matrix K = [ fx   0  cx ]
   #                   [  0  fy  cy ]
   #                   [  0   0   1 ]
   # fx = 953.16 px, fy = 952.16 px (focal length); cx = 793.38 px, cy = 642.41 px (principal point)
   camera_matrix: !!opencv-matrix
      rows: 3
      cols: 3
      dt: d
      data: [ 953.15627579935767, 0., 793.37617611691246, 0.,
          952.15873289726596, 642.41320683628078, 0., 0., 1. ]
   # distortion_coefficients = [k1, k2, p1, p2, k3] (OpenCV standard model)
   # k1, k2, k3: radial distortion (negative k1 = barrel); p1, p2: tangential (lens tilt)
   # k1 = 0.05981, k2 = -0.08010, p1 = 0.00015, p2 = 0.00007, k3 = 0.01839
   distortion_coefficients: !!opencv-matrix
      rows: 1
      cols: 5
      dt: d
