# ---- Stereo extrinsics: where the right camera sits relative to the left ----
stereo:
   status: computed
   # R and T map a point from the LEFT camera frame to the RIGHT:
   #   X_right = R @ X_left + T        (T in mm, same units as tag_size_mm)
   # Intrinsics were held fixed (CALIB_FIX_INTRINSIC) while these were fitted.
   rotation_matrix: !!opencv-matrix
      rows: 3
      cols: 3
      dt: d
      data: [ 0.99984190830554331, -0.0019051852004269168,
          -0.017678480287670821, 0.0018675351476542693,
          0.99999595354265713, -0.0021459754854837396,
          0.017682497233189876, 0.0021126210412886343,
          0.99984142048823632 ]
   translation_mm: !!opencv-matrix
      rows: 3
      cols: 1
      dt: d
      data: [ -150.38402868832651, 1.789896263271809,
          -6.6689775180915642 ]
   # baseline |T| = 150.54 mm - CHECK THIS AGAINST A RULER.
   # It carries the same scale error as TAG_SIZE, so a wrong tag size shows up here
   # first, and then in every reconstructed distance.
   baseline_mm: 150.54246933773038
   # Rotation as angles about x, y, z (Rodrigues), degrees: 0.122, -1.013, 0.108
   rotation_angles_deg: [ 0.12200632548352687, -1.0130715379359088,
       0.10808625420431177 ]
