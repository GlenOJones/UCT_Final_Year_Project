   # camera_matrix K = [ fx   0  cx ]
   #                   [  0  fy  cy ]
   #                   [  0   0   1 ]
   # fx = 712.86 px, fy = 712.08 px (focal length); cx = 792.97 px, cy = 644.58 px (principal point)
