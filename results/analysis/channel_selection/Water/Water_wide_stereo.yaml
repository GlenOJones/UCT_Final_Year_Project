# =====================================================================
# STEREO CAMERA CALIBRATION
# Generated by src/01_Calibration/Calibration.py - re-run the script rather than editing by hand.
# Units: px = pixels (image quantities), mm = millimetres (board sizes).
# Numbers are stored at full precision; comments show rounded values for reading.
# Load in Python:
#   fs = cv2.FileStorage("results/analysis/channel_selection/Water/Water_wide_stereo.yaml", cv2.FILE_STORAGE_READ)
#   K_left = fs.getNode("left_camera").getNode("camera_matrix").mat()
# =====================================================================
metadata:
   created: "2026-10-08T11:34:19"
   script: "src/01_Calibration/Calibration.py"
   opencv_version: "5.0.0"
   frames_dir: data/Calibration/FinalComparison/Water
# Image size the calibration was made at; it is only valid at this resolution
image:
   width_px: 1600
   height_px: 1200
# Calibration target: Kalibr AprilGrid (kalibr_create_target_pdf --type apriltag --nx 10 --ny 7)
calibration_board:
   type: Kalibr AprilGrid
   tag_family: AprilTag 36h11
   tags_x: 10
   tags_y: 7
   # tag size 35.36 mm (outer black square, as printed), gap 10.61 mm
   tag_size_mm: 35.359999999999999
   tag_gap_mm: 10.607999999999999
   # Detection: the detector named below with the thresholding preset named below,
   # its own corner refinement off, then cv2.cornerSubPix, both on the image channel named
   # below. 'aruco' is cv2.aruco.ArucoDetector; 'uwaruco' is the re-implementation of
   # Cejka et al. 2019 (doi:10.3390/rs11040459) in src/UWARUco.
   # channel: gray = BGR2GRAY of the colour frame, y = the camera's JPEG luma, r/g/b = one colour channel
   channel: gray
   detector: aruco
   detector_preset: wide
   # Full detector settings for this preset, so the run can be reproduced from this file alone:
   detector_settings: "adaptiveThreshWinSizeMax=53, adaptiveThreshWinSizeMin=3, adaptiveThreshWinSizeStep=5, errorCorrectionRate=1.0, markerBorderBits=2, minOtsuStdDev=2.0"
   corner_refinement: cornerSubPix
   # cornerSubPix half-window = 0.15 x tag side in px (at least 2 px)
   corner_window_fraction: 0.14999999999999999
   corner_window_min_px: 2
   min_tags_per_image: 10
left_camera:
   # ---- Intrinsics: pinhole model + lens distortion ----
   # camera_matrix K = [ fx   0  cx ]
   #                   [  0  fy  cy ]
   #                   [  0   0   1 ]
   # fx = 953.42 px, fy = 952.47 px (focal length); cx = 793.54 px, cy = 642.21 px (principal point)
   camera_matrix: !!opencv-matrix
      rows: 3
      cols: 3
      dt: d
      data: [ 953.42055637809153, 0., 793.54313463143797, 0.,
          952.47319736807208, 642.21427750359726, 0., 0., 1. ]
   # distortion_coefficients = [k1, k2, p1, p2, k3] (OpenCV standard model)
   # k1, k2, k3: radial distortion (negative k1 = barrel); p1, p2: tangential (lens tilt)
   # k1 = 0.06031, k2 = -0.08145, p1 = 0.00012, p2 = -0.00007, k3 = 0.01873
   distortion_coefficients: !!opencv-matrix
      rows: 1
      cols: 5
      dt: d
      data: [ 0.060313102409334018, -0.081447296277628714,
          0.00012350568641397001, -6.7935864848709269e-05,
          0.018730691394846035 ]
   # Readable copies of the values above
   focal_length_x_px: 953.42055637809153
   focal_length_y_px: 952.47319736807208
   principal_point_x_px: 793.54313463143797
   principal_point_y_px: 642.21427750359726
